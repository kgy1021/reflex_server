<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reflex Tester</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .screen {
        display: none;
        text-align: center;
        width: 90%;
        max-width: 400px;
    }

    .box {
        width: 250px;
        height: 250px;
        margin: 20px auto;
        border-radius: 10px;
        background-color: #d9534f;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        color: white;
        cursor: pointer;
        user-select: none;
    }

    .green {
        background-color: #5cb85c !important;
    }

    button {
        padding: 12px 18px;
        margin: 10px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        cursor: pointer;
        background-color: #0275d8;
        color: white;
    }

    button:hover {
        opacity: 0.9;
    }

    .ranking-list {
        text-align: left;
        margin-top: 20px;
        font-size: 14px;
    }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home" class="screen">
    <h1>Reflex Tester</h1>
    <input id="nickname-input" type="text" placeholder="Enter nickname" style="padding:8px; width:80%; border-radius:6px;">
    <br><br>
    <button id="start-btn">Start Game</button>
    <button id="ranking-btn">View Ranking</button>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen">
    <h2 id="game-status">Wait for green…</h2>
    <div id="game-box" class="box">Ready</div>
    <button id="cancel-btn">Home</button>
</div>

<!-- RESULT SCREEN -->
<div id="result" class="screen">
    <h2>Your Reaction Time</h2>
    <h1 id="result-time">0 ms</h1>
    <div id="nickname-display"></div>

    <h3>Top 10 Ranking</h3>
    <div id="ranking" class="ranking-list"></div>

    <button id="retry-btn">Retry</button>
    <button id="home-btn">Home</button>
</div>

<script>
/* ------------ CONFIG: UPDATE TO YOUR REAL RENDER URL ------------ */
const API = "https://reflex-server-2.onrender.com";

/* ------------------------ BASIC SETUP ------------------------ */
const homeScreen = document.getElementById("home");
const gameScreen = document.getElementById("game");
const resultScreen = document.getElementById("result");

function show(screen) {
    homeScreen.style.display = "none";
    gameScreen.style.display = "none";
    resultScreen.style.display = "none";
    document.getElementById(screen).style.display = "block";
}

// 초기 화면
show("home");

let timer = null;
let startTime = 0;
let gameState = "idle";
let nickname = "";

// DOM
const gameBox = document.getElementById("game-box");
const gameStatus = document.getElementById("game-status");

/* ------------------------ GAME START ------------------------ */
function startGame() {
    gameState = "waiting";
    gameStatus.textContent = "Wait for green…";
    gameBox.textContent = "Wait…";
    gameBox.classList.remove("green");
    gameBox.style.backgroundColor = "#d9534f";

    const delay = Math.random() * 5000;

    timer = setTimeout(() => {
        gameState = "ready";
        startTime = performance.now();
        gameBox.classList.add("green");
        gameBox.textContent = "Tap!";
        gameStatus.textContent = "Tap now!";
    }, delay);
}

/* ------------------------ GAME BOX CLICK ------------------------ */
gameBox.addEventListener("click", () => {
    if (gameState === "waiting") {
        clearTimeout(timer);
        gameState = "cooldown";

        gameBox.textContent = "Too early!";
        gameStatus.textContent = "Wait for green before tapping.";
        gameBox.classList.remove("green");
        gameBox.style.backgroundColor = "#d9534f";

        setTimeout(() => {
            startGame();
        }, 1000);

        return;
    }

    if (gameState === "ready") {
        const reaction = Math.floor(performance.now() - startTime);
        finishGame(reaction);
    }
});

/* ------------------------ FINISH GAME ------------------------ */
async function finishGame(time) {
    gameState = "finished";

    show("result");
    document.getElementById("result-time").textContent = `${time} ms`;
    document.getElementById("nickname-display").textContent = `Player: ${nickname}`;

    try {
        // 1) 기록 저장
        await fetch(`${API}/ranking`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nickname, time })
        });

        // 2) 저장 후 최신 랭킹 다시 요청
        const res2 = await fetch(`${API}/ranking`);
        const rankingList = await res2.json();

        // 3) 최신 랭킹 렌더링
        renderRanking(rankingList);

    } catch (err) {
        console.error(err);
        document.getElementById("ranking").textContent = "Failed to load ranking.";
    }
}


/* ------------------------ RENDER RANKING ------------------------ */
function renderRanking(list) {
    const rankingDiv = document.getElementById("ranking");
    rankingDiv.innerHTML = "";

    if (!Array.isArray(list) || list.length === 0) {
        rankingDiv.textContent = "No records yet.";
        return;
    }

    list.slice(0, 10).forEach((r, i) => {
        let medal = "";
        if (i === 0) medal = "🥇 ";
        else if (i === 1) medal = "🥈 ";
        else if (i === 2) medal = "🥉 ";

        const line = document.createElement("div");
        line.textContent = `${medal}${i + 1}. ${r.nickname} - ${r.time} ms`;
        rankingDiv.appendChild(line);
    });
}

/* ------------------------ BUTTON HANDLERS ------------------------ */

document.getElementById("start-btn").addEventListener("click", () => {
    const input = document.getElementById("nickname-input").value.trim();
    if (!input) {
        alert("Please enter a nickname.");
        return;
    }
    nickname = input;
    show("game");
    startGame();
});

document.getElementById("ranking-btn").addEventListener("click", async () => {
    show("result");
    document.getElementById("result-time").textContent = "";
    document.getElementById("nickname-display").textContent = "";
    document.getElementById("ranking").textContent = "Loading...";

    try {
        const res = await fetch(`${API}/ranking`);
        const data = await res.json();
        renderRanking(data);
    } catch (err) {
        console.error(err);
        document.getElementById("ranking").textContent = "Failed to load ranking.";
    }
});

document.getElementById("retry-btn").addEventListener("click", () => {
    show("game");
    startGame();
});

document.getElementById("home-btn").addEventListener("click", () => {
    show("home");
});

document.getElementById("cancel-btn").addEventListener("click", () => {
    clearTimeout(timer);
    gameState = "idle";
    show("home");
});
</script>
</body>
</html>
