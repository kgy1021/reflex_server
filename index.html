<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reflex Tester</title>
  <style>
    body {
      background-color: #eaf4ff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    /* Main container for centering */
    .container {
      max-width: 420px;
      margin: 50px auto;
      padding: 20px;
    }

    /* Card style */
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0px 3px 10px rgba(100, 140, 200, 0.25);
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input {
      width: 90%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #8fb8ff;
      margin-top: 8px;
      font-size: 16px;
    }

    .btn {
      display: inline-block;
      background: #8cbcff;
      padding: 12px 20px;
      margin: 8px;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      font-size: 16px;
    }

    .btn:hover {
      background: #75a7f7;
    }

    /* Reaction Box */
    #reaction-box {
      width: 100%;
      height: 150px;
      border-radius: 12px;
      margin-top: 10px;
      background: red;
      cursor: pointer;
    }

    /* Ranking cards */
    .rank-item {
      background: #d9eaff;
      padding: 12px;
      border-radius: 12px;
      margin: 8px 0;
      box-shadow: 0 2px 6px rgba(140, 170, 220, 0.3);
      text-align: left;
      font-size: 17px;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- HOME SCREEN -->
    <div id="home-screen" class="card">
      <div class="title">Reflex Tester</div>

      <div class="card">
        <label>Enter Nickname</label><br />
        <input id="nickname-input" type="text" placeholder="Nickname" />
      </div>

      <div>
        <div class="btn" onclick="startGameFromHome()">Start Game</div>
        <div class="btn" onclick="showRanking()">View Ranking</div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="card hidden">
      <div class="card">
        <div id="game-message">Wait for green...</div>
      </div>

      <div id="reaction-box" onclick="boxClicked()"></div>

      <div class="btn" onclick="returnHome()">Home</div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="hidden">

      <div class="card">
        <div id="result-time" class="title"></div>
        <div id="result-comment"></div>
      </div>

      <div id="ranking-area" class="card"></div>

      <div>
        <div class="btn" onclick="restartGame()">Retry</div>
        <div class="btn" onclick="returnHome()">Home</div>
      </div>
    </div>

  </div>

<script>
  const API_BASE_URL = "https://reflex-server.onrender.com"; // 네 서버 주소

  let nickname = "";
  let gameStarted = false;
  let greenTime = 0;

  function showScreen(id) {
    document.getElementById("home-screen").classList.add("hidden");
    document.getElementById("game-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.add("hidden");

    document.getElementById(id).classList.remove("hidden");
  }

  function returnHome() {
    showScreen("home-screen");
  }

  function startGameFromHome() {
    nickname = document.getElementById("nickname-input").value.trim();
    if (nickname === "") {
      alert("Please enter a nickname.");
      return;
    }
    startGame();
  }

  function startGame() {
    showScreen("game-screen");
    gameStarted = false;
    document.getElementById("reaction-box").style.background = "red";
    document.getElementById("game-message").textContent = "Wait for green...";

    setTimeout(() => {
      document.getElementById("reaction-box").style.background = "green";
      greenTime = Date.now();
      gameStarted = true;
    }, Math.random() * 5000);
  }

  function boxClicked() {
    if (!greenTime) return;

    if (!gameStarted) {
      alert("Too early! Try again.");
      startGame();
      return;
    }

    const reaction = Date.now() - greenTime;
    finishGame(reaction);
  }

  //---------------------------
  // 반응속도 멘트 로직
  //---------------------------
  function getReactionMessage(ms) {
    if (ms < 20) return "GODLIKE — Impossible reflexes!";
    if (ms < 70) return "Superhuman speed!";
    if (ms < 150) return "Pro-level reflex!";
    if (ms < 220) return "Above average!";
    if (ms < 300) return "Average human response.";
    if (ms < 450) return "A bit slow.";
    return "Snail mode — Were you sleeping?";
  }

  //---------------------------
  // ⭐ POST → GET 순서로 수정
  //---------------------------
  async function finishGame(ms) {
    showScreen("result-screen");

    // 1) 결과 표시
    document.getElementById("result-time").textContent = ms + " ms";
    document.getElementById("result-comment").textContent = getReactionMessage(ms);

    const payload = { nickname, time: ms };

    // 2) 새 기록을 먼저 저장 (POST)
    try {
      await fetch(`${API_BASE_URL}/ranking`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
    } catch (err) {
      console.error("POST error:", err);
    }

    // 3) 저장 완료 후 최신 랭킹 GET
    await loadRanking(true);
  }

  //---------------------------
  // 최신 랭킹 불러오기
  //---------------------------
  async function loadRanking(showTopOnly) {
    const area = document.getElementById("ranking-area");
    area.innerHTML = "<div>Loading ranking...</div>";

    try {
      const res = await fetch(`${API_BASE_URL}/ranking`);
      const data = await res.json();

      let html = "<div class='title'>Top 5 Ranking</div>";

      data.slice(0, 5).forEach((entry, i) => {
        const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "";
        html += `
          <div class="rank-item">
            ${i + 1}. ${entry.nickname} — ${entry.time} ms ${medal}
          </div>`;
      });

      area.innerHTML = html;

    } catch (err) {
      area.innerHTML = "<div>Error loading ranking</div>";
      console.error(err);
    }
  }

  function showRanking() {
    showScreen("result-screen");
    loadRanking(true);
  }

  function restartGame() {
    greenTime = 0;
    startGame();
  }

</script>

</body>
</html>
